<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 28b - Game kiểm tra tốc độ</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }

      .dashboard {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        font-size: 20px;
        margin-bottom: 12px;
      }
      .dashboard b {
        color: #1d4ed8;
      }

      #arena {
        position: relative;
        width: 700px;
        height: 450px;
        margin: 0 auto 12px;
        background: linear-gradient(135deg, #dbeafe, #e0e7ff);
        border: 4px solid #2563eb;
        border-radius: 10px;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
      }
      #arena.locked {
        border-color: #ef4444;
        cursor: not-allowed;
      }

      #toast {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border-radius: 16px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 5;
      }
      #toast.show {
        opacity: 1;
      }

      .target {
        position: absolute;
        border-radius: 50%;
        cursor: pointer;
        animation: appear 0.25s ease-out;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      .target.green {
        background: #22c55e;
        border: 3px solid #15803d;
      }
      .target.trap {
        background: #ef4444;
        border: 3px solid #991b1b;
      }
      .target.gold {
        background: #facc15;
        border: 3px solid #ca8a04;
        animation:
          appear 0.25s ease-out,
          pulse 0.5s ease-in-out infinite alternate 0.25s;
      }
      .target.hide {
        animation: shrink 0.25s ease-in forwards;
        pointer-events: none;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes shrink {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0);
        }
      }
      @keyframes pulse {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.15);
        }
      }

      #btnStart {
        padding: 10px 26px;
        font-size: 18px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #btnStart:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      #result {
        margin-top: 12px;
        font-size: 22px;
        font-weight: bold;
        color: #16a34a;
        min-height: 30px;
      }
      .legend {
        margin-top: 8px;
        font-size: 14px;
        color: #374151;
      }
      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .controls label {
        font-size: 16px;
      }
      #timeInput {
        width: 70px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        text-align: center;
      }
      #timeInput:disabled {
        background: #e5e7eb;
      }
      #btnColor {
        padding: 10px 20px;
        font-size: 18px;
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #btnPlayer {
        padding: 10px 20px;
        font-size: 18px;
        background: #059669;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #playerInfo {
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
        color: #1d4ed8;
        min-height: 26px;
      }
    </style>
  </head>
  <body>
    <h1>Game kiểm tra tốc độ - Nâng cấp 2</h1>

    <div class="dashboard">
      <div>Điểm: <b id="score">0</b></div>
      <div>Mạng: <b id="lives">❤️❤️❤️</b></div>
      <div>Cấp độ: <b id="level">1</b></div>
      <div>Thời gian: <b id="time">60</b>s</div>
      <div>Kỷ lục: <b id="best">0</b></div>
    </div>

    <div id="arena"><div id="toast"></div></div>

    <div class="controls">
      <label for="timeInput">Thời gian (giây):</label>
      <input type="number" id="timeInput" value="60" min="5" max="600" />
      <button id="btnStart">Bắt đầu trò chơi</button>
      <button id="btnColor">Đổi màu nền</button>
      <button id="btnPlayer">Người chơi</button>
    </div>
    <div id="playerInfo"></div>
    <div id="result"></div>
    <div class="legend">
      🟢 Xanh: +1 điểm &nbsp;|&nbsp; 🔴 Đỏ (bẫy): -2 điểm và mất 1 mạng
      &nbsp;|&nbsp; 🟡 Vàng: +3 điểm, +2 giây (bỏ lỡ sẽ mất 1 mạng)
    </div>

    <script>
      const DEFAULT_TIME = 60;
      const MIN_TIME = 5;
      const MAX_TIME = 600;
      const STUDENT_ID = "241A290022";
      const MAX_LIVES = 3;
      const TARGET_SIZE = 46;
      const MAX_TARGETS = 4;
      const BASE_SPAWN = 1000;
      const BASE_LIFE = 2000;
      const GOLD_LIFE = 1500;
      const SHRINK = 0.85;
      const LOCK_TIME = 500;
      const HS_KEY = "bt28a_hs";

      const arena = document.getElementById("arena");
      const toast = document.getElementById("toast");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const levelEl = document.getElementById("level");
      const timeEl = document.getElementById("time");
      const bestEl = document.getElementById("best");
      const btnStart = document.getElementById("btnStart");
      const btnColor = document.getElementById("btnColor");
      const btnPlayer = document.getElementById("btnPlayer");
      const timeInput = document.getElementById("timeInput");
      const playerInfo = document.getElementById("playerInfo");
      const resultEl = document.getElementById("result");

      let score, lives, level, timeLeft;
      let isPlaying = false;
      let isLocked = false;
      let targets = [];
      let spawnTimer = null;
      let countdownTimer = null;
      let lockTimer = null;
      let toastTimer = null;
      let lastMiss = null;

      const SECRET = "bt28a-key";

      function checksum(n) {
        return (n * 7919 + 1337) % 100003;
      }

      function encode(n) {
        const raw = n + ":" + checksum(n);
        let out = "";
        for (let i = 0; i < raw.length; i++) {
          out += String.fromCharCode(
            raw.charCodeAt(i) ^ SECRET.charCodeAt(i % SECRET.length),
          );
        }
        return btoa(out);
      }

      function decode(str) {
        try {
          const bin = atob(str);
          let raw = "";
          for (let i = 0; i < bin.length; i++) {
            raw += String.fromCharCode(
              bin.charCodeAt(i) ^ SECRET.charCodeAt(i % SECRET.length),
            );
          }
          const [n, cs] = raw.split(":").map(Number);
          return checksum(n) === cs ? n : 0;
        } catch (e) {
          return 0;
        }
      }

      function loadBest() {
        const saved = localStorage.getItem(HS_KEY);
        return saved ? decode(saved) : 0;
      }

      function saveBest(n) {
        localStorage.setItem(HS_KEY, encode(n));
      }

      function renderStats() {
        scoreEl.textContent = score;
        livesEl.textContent = lives > 0 ? "❤️".repeat(lives) : "💀";
        levelEl.textContent = level;
        timeEl.textContent = timeLeft;
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1200);
      }

      function factor() {
        return Math.max(0.3, Math.pow(SHRINK, level - 1));
      }

      function changeScore(delta) {
        score = Math.max(0, score + delta);

        const newLevel = Math.max(level, 1 + Math.floor(score / 10));
        if (newLevel > level) {
          level = newLevel;
          showToast("Lên cấp " + level + "! Nhanh hơn 15%");
        }
        renderStats();
      }

      function loseLife() {
        lives--;
        renderStats();
        if (lives <= 0) endGame("Hết mạng!");
      }

      function findPosition() {
        const maxLeft = arena.clientWidth - TARGET_SIZE;
        const maxTop = arena.clientHeight - TARGET_SIZE;
        for (let attempt = 0; attempt < 50; attempt++) {
          const left = Math.floor(Math.random() * (maxLeft + 1));
          const top = Math.floor(Math.random() * (maxTop + 1));
          const overlap = targets.some(
            (t) => Math.hypot(t.left - left, t.top - top) < TARGET_SIZE + 10,
          );
          if (!overlap) return { left, top };
        }
        return null;
      }

      function randomType() {
        const r = Math.random();
        if (r < 0.6) return "green";
        if (r < 0.85) return "trap";
        return "gold";
      }

      function spawnTarget() {
        if (!isPlaying) return;
        if (targets.length < MAX_TARGETS) {
          const pos = findPosition();
          if (pos) {
            const type = randomType();
            const el = document.createElement("div");
            el.className = "target " + type;
            el.style.width = el.style.height = TARGET_SIZE + "px";
            el.style.left = pos.left + "px";
            el.style.top = pos.top + "px";
            arena.appendChild(el);

            const t = {
              el,
              type,
              left: pos.left,
              top: pos.top,
              dead: false,
              timeoutId: null,
            };
            const life = (type === "gold" ? GOLD_LIFE : BASE_LIFE) * factor();

            t.timeoutId = setTimeout(() => expireTarget(t), life);
            targets.push(t);
          }
        }

        spawnTimer = setTimeout(spawnTarget, BASE_SPAWN * factor());
      }

      function removeTarget(t) {
        if (t.dead) return;
        t.dead = true;
        clearTimeout(t.timeoutId);
        targets = targets.filter((x) => x !== t);
        t.el.classList.add("hide");
        setTimeout(() => t.el.remove(), 250);
      }

      function expireTarget(t) {
        if (t.dead || !isPlaying) return;
        removeTarget(t);
        if (t.type === "gold") {
          showToast("Bỏ lỡ mục tiêu vàng! -1 mạng");
          loseLife();
        }
      }

      function lockInput() {
        isLocked = true;
        arena.classList.add("locked");
        clearTimeout(lockTimer);
        lockTimer = setTimeout(() => {
          isLocked = false;
          arena.classList.remove("locked");
        }, LOCK_TIME);
      }

      function hitTarget(t) {
        if (t.dead) return;
        removeTarget(t);
        lastMiss = null;
        if (t.type === "green") {
          changeScore(1);
        } else if (t.type === "trap") {
          changeScore(-2);
          showToast("Dính bẫy! -2 điểm, -1 mạng");
          loseLife();
        } else if (t.type === "gold") {
          changeScore(3);
          timeLeft += 2;
          renderStats();
          showToast("Vàng! +3 điểm, +2 giây");
        }
      }

      function missClick(x, y) {
        const now = Date.now();
        if (
          lastMiss &&
          now - lastMiss.t < 1000 &&
          Math.hypot(x - lastMiss.x, y - lastMiss.y) < 25
        ) {
          changeScore(-1);
          lockInput();
          showToast("Phát hiện spam click! -1 điểm, khóa 0.5s");
          lastMiss = null;
          return;
        }
        lastMiss = { x, y, t: now };
      }

      arena.addEventListener("click", function (e) {
        if (!isPlaying || isLocked) return;
        const el = e.target.closest(".target");
        if (el) {
          const t = targets.find((x) => x.el === el);
          if (t) hitTarget(t);
        } else {
          const rect = arena.getBoundingClientRect();
          missClick(e.clientX - rect.left, e.clientY - rect.top);
        }
      });

      function clearAll() {
        clearTimeout(spawnTimer);
        clearInterval(countdownTimer);
        clearTimeout(lockTimer);
        clearTimeout(toastTimer);
        targets.forEach((t) => {
          clearTimeout(t.timeoutId);
          t.el.remove();
        });
        targets = [];
        spawnTimer = countdownTimer = lockTimer = toastTimer = null;
        isLocked = false;
        arena.classList.remove("locked");
        toast.classList.remove("show");
      }

      function startGame() {
        clearAll();
        score = 0;
        lives = MAX_LIVES;
        level = 1;
        timeLeft = readTime();
        timeInput.value = timeLeft;
        timeInput.disabled = true;
        lastMiss = null;
        isPlaying = true;
        resultEl.textContent = "";
        btnStart.disabled = true;
        renderStats();

        spawnTarget();
        countdownTimer = setInterval(() => {
          timeLeft--;
          renderStats();
          if (timeLeft <= 0) endGame("Hết giờ!");
        }, 1000);
      }

      function endGame(reason) {
        if (!isPlaying) return;
        isPlaying = false;
        clearAll();
        timeLeft = Math.max(0, timeLeft);
        renderStats();

        let msg = reason + " Tổng điểm: " + score;
        const best = loadBest();
        if (score > best) {
          saveBest(score);
          bestEl.textContent = score;
          msg += " - Kỷ lục mới! 🎉";
        }
        resultEl.textContent = msg;
        btnStart.disabled = false;
        timeInput.disabled = false;
        btnStart.textContent = "Chơi lại";
      }

      function readTime() {
        let v = parseInt(timeInput.value, 10);
        if (isNaN(v)) v = DEFAULT_TIME;
        return Math.min(MAX_TIME, Math.max(MIN_TIME, v));
      }

      timeInput.addEventListener("change", function () {
        timeInput.value = readTime();
        if (!isPlaying) {
          timeLeft = readTime();
          renderStats();
        }
      });

      btnColor.addEventListener("click", function () {
        const h = Math.floor(Math.random() * 360);
        arena.style.background = "hsl(" + h + ", 70%, 85%)";
      });

      btnPlayer.addEventListener("click", function () {
        playerInfo.textContent = "Mã sinh viên: " + STUDENT_ID;
      });

      btnStart.addEventListener("click", startGame);

      score = 0;
      lives = MAX_LIVES;
      level = 1;
      timeLeft = DEFAULT_TIME;
      renderStats();
      bestEl.textContent = loadBest();
    </script>
  </body>
</html>
